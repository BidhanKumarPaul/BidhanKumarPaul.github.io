<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/png" href="assets/img/logo-192.png">
<title>BKP Writes — Notes on math, code and learning</title>
<meta name="description" content="BKP Writes: short notes on programming, applied mathematics and machine learning by Bidhan Kumar Paul.">
<meta property="og:title" content="BKP Writes"><meta property="og:description" content="Notes on math, code and learning."><meta property="og:image" content="https://bidhankumarpaul.github.io/assets/img/og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#7c5cff"><style>
:root{--bg:#07090f;--card:#0f1420;--text:#e8ecf4;--mut:#8b95a9;--a:#7c5cff;--b:#22d3ee;--line:#1e2638;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f7fb;--card:#fff;--text:#12172a;--mut:#5b657a;--line:#e3e7f0}}
:root[data-theme="light"]{--bg:#f6f7fb;--card:#fff;--text:#12172a;--mut:#5b657a;--line:#e3e7f0}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}a{color:inherit;text-decoration:none}
.grad{background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line)}nav b{font-size:20px}nav a.back{color:var(--mut);font-size:14px}
main{max-width:760px;margin:auto;padding:60px 5vw}h1{font-size:clamp(34px,6vw,52px);line-height:1.1;margin-bottom:8px}.mu{color:var(--mut)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;transition:.25s}.card:hover{transform:translateY(-4px);border-color:var(--a)}
.card h2{font-size:21px;margin:6px 0}.tag{font-size:12px;font-weight:700;color:var(--b)}
article h1{font-size:clamp(28px,5vw,42px);margin:10px 0 18px}article p,article ul,article ol{margin:14px 0}article li{margin:6px 0 6px 22px}
footer{text-align:center;color:var(--mut);padding:40px 5vw;border-top:1px solid var(--line);font-size:14px}
</style></head><body>
<nav><a href="index.html" style="display:flex;align-items:center;gap:10px"><img src="assets/img/logo-192.png" alt="BKPIT logo" width="32" height="32" style="border-radius:22%"><b class="grad">BKPIT</b></a><a class="back" href="index.html">← Back to portfolio</a></nav>
<main id="m"></main>
<footer>© <span id="y"></span> BKPIT. <b class="grad">Developed by BKPIT</b></footer>
<script src="posts.js"></script>
<script>
const m=document.getElementById('m'),P=window.POSTS||[];document.getElementById('y').textContent=new Date().getFullYear();
const fd=d=>new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
function render(){const id=location.hash.replace('#/','');const p=P.find(x=>x.id===id);
 if(p){document.title=p.title+' — BKP Writes';m.innerHTML=`<a class="mu" href="#/">← All posts</a><article><span class="tag">${p.tag}</span> <span class="mu">· ${fd(p.date)}</span><h1>${p.title}</h1>${p.body}</article>`}
 else{document.title='BKP Writes — Notes on math, code and learning';m.innerHTML=`<h1><span class="grad">BKP</span> Writes</h1><p class="mu">Notes on math, code and learning in public.</p>`+P.map(x=>`<a class="card" href="#/${x.id}"><span class="tag">${x.tag}</span> <span class="mu">· ${fd(x.date)}</span><h2>${x.title}</h2><p class="mu">${x.summary}</p></a>`).join('')}
 scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>

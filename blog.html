 if(p){document.title=p.title+' — BKP Writes';m.innerHTML=`<a class="mu" href="#/">← All posts</a><article><span class="tag">${p.tag}</span> <span class="mu">· ${fd(p.date)}</span><h1>${p.title}</h1>${p.body}</article>`}
 else{document.title='BKP Writes — Notes on math, code and learning';m.innerHTML=`<h1><span class="grad">BKP</span> Writes</h1><p class="mu">Notes on math, code and learning in public.</p>`+P.map(x=>`<a class="card" href="#/${x.id}"><span class="tag">${x.tag}</span> <span class="mu">· ${fd(x.date)}</span><h2>${x.title}</h2><p class="mu">${x.summary}</p></a>`).join('')}
 scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
